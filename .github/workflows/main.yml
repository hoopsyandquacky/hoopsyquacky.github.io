name: Hoopsy & Quacky Companion Hub Automation

on:
  workflow_dispatch: # Permette l'esecuzione manuale da GitHub
  schedule:
    - cron: '0 8 * * *' # Esecuzione automatica ogni giorno alle 08:00 UTC

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Esecuzione Automazione
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: python main.py
