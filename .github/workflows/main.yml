name: Hoopsy & Quacky Companion Hub

on:
  workflow_dispatch: # Permette di eseguirlo anche a mano quando vuoi
  schedule:
    # Esegue automaticamente lo script ogni 15 minuti
    - cron: '*/15 * * * *'

jobs:
  run-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Companion Hub
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          python main.py
